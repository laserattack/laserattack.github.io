  <!-- Two offset laser bolts, travelling in opposite directions. -->
  <g stroke-linecap="round">
    <path d="M92 44h18m1 10h-9" stroke="currentColor" stroke-width="8" opacity=".18"/>
    <path d="M92 44h18m1 10h-9" stroke="currentColor" stroke-width="3"/>
