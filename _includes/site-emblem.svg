    <ellipse cx="36" cy="35" rx="3.5" ry="5" fill="currentColor" stroke="none"/>
    <path d="M26 52q8-6 17-1"/>
    <!-- Slime's ray gun and squishy arm. -->
    <path d="M47 50q8 5 14-5m-12 12q10 4 16-8"/>
    <path d="M59 39h17q5 0 5 5t-5 5h-8l-2 9h-6l3-10h-4z" fill="currentColor" fill-opacity=".35"/>
    <path d="M79 41h6v6h-6m-14-8v-4h8v4"/>
