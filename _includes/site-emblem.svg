<svg class="site-symbol" xmlns="http://www.w3.org/2000/svg" viewBox="-2 0 208 80" fill="none" aria-hidden="true" focusable="false">
  <!-- A grumpy alien slime faces a space-adventurer duck. -->
  <g stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Move the body outward while keeping the gun and hand fixed. -->
    <g transform="translate(-6 0)">
    <!-- Simple Bulovan-inspired cyclops silhouette. -->
    <path d="M10 60c5-8 0-20 7-31 6-11 23-14 32-3 9 10 3 23 12 35 8 12-8 13-15 8-7 7-15 2-19 0-13 6-25 0-17-9Z" fill="currentColor" fill-opacity=".2"/>
    <path d="M32 20q-5-7 0-12"/>
    <circle cx="33" cy="6" r="3" fill="currentColor"/>
    <path d="M23 30q10-5 21 0c0 17-21 17-21 0Z" fill="var(--color-background, #222)"/>
    <ellipse cx="36" cy="35" rx="3.5" ry="5" fill="currentColor" stroke="none"/>
    <path d="M26 52q8-6 17-1"/>
    </g>
    <!-- Slime's ray gun and extended squishy arm. -->
    <path d="M43 57q9 7 18-2"/>
    <path d="M59 39h17q5 0 5 5t-5 5h-8l-2 9h-6l3-10h-4z" fill="currentColor" fill-opacity=".35"/>
    <path d="M79 41h6v6h-6m-14-8v-4h8v4"/>
    <!-- Fingers wrap around the grip, in front of the gun. -->
    <path d="M60 52q1-2 3-1l4 1q2 1 0 3l-4 2q-3 0-3-3Z" fill="var(--color-background, #222)"/>
    <g transform="translate(16 0)">
    <!-- Duck in profile: clean cap, broad bill and a dark pupil. -->
    <path d="M150 55q14-5 22 4 5 5 6 12h-33q-1-10 5-16Z" fill="currentColor" fill-opacity=".2"/>
    <path d="m150 71-5 6h14l3-6m8 0 2 6h13l-8-6"/>
    <path d="M149 21c-8 4-10 13-8 21 1 10 8 15 17 15 13 0 19-10 17-22-1-10-12-18-26-14Z" fill="currentColor" fill-opacity=".2"/>
    <path d="M142 37c-5 1-10 3-16 3-4 0-5 3-2 5 6 4 18 5 25 1q3-2 2-5" fill="currentColor" fill-opacity=".2"/>
    <path d="M125 44q11 2 21-1" stroke-width="2"/>
    <ellipse cx="151" cy="32" rx="6" ry="8" fill="currentColor" stroke="none"/>
    <ellipse cx="149" cy="33" rx="2.5" ry="4.5" fill="var(--color-background, #222)" stroke="none"/>
    <!-- Baseball cap with a forward-facing brim. -->
    <path d="M142 23C141 16 148 11 157 11C165 11 171 17 169 23Z" fill="var(--color-background, #222)" stroke="none"/>
    <path d="M142 23C141 16 148 11 157 11C165 11 171 17 169 23Z" fill="currentColor" fill-opacity=".25"/>
    <path d="M143 21h-11q-7 1 0 3h11Z" fill="currentColor" fill-opacity=".35"/>
    <path d="M157 12q-6 4-6 10" stroke-width="1.5"/>
    <path d="m156 58 5 6 5-7"/>
    <!-- The arm emerges from the middle of the sleeve and meets the lowered hand. -->
    <path d="M158.5 61Q147 69 131 66"/>
    <!-- Counter the body shift so the gun and hand stay in place. -->
    <g transform="translate(-8 0)">
    <path d="M123 51h15q5 0 5 5v3h-8l3 8h-6l-5-8h-4q-4 0-4-4t4-4Z" fill="currentColor" fill-opacity=".35"/>
    <path d="M119 52h-6v6h6"/>
    <!-- The wing ends in a hand clasping the angled grip. -->
    <path d="M139 64q-1-2-3-1l-4 1q-2 1 0 3l4 2q3 0 3-3Z" fill="var(--color-background, #222)"/>
    </g>
    </g>
  </g>
  <!-- Laser bolts use the navbar accent, with a translucent halo and white core. -->
  <g stroke-linecap="round" style="color: var(--color-pink, #e6a4d5)">
    <path d="M92 44h18m1 11h-9" stroke="currentColor" stroke-width="8" opacity=".18"/>
    <path d="M92 44h18m1 11h-9" stroke="currentColor" stroke-width="3"/>
    <path d="M94 44h14m1 11h-5" stroke="#fff" stroke-width="1"/>
    <path d="m111 34 3-5m5 9 5-1m-23 27-2 4" stroke="currentColor" stroke-width="2"/>
  </g>
</svg>
