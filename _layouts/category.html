---
layout: page
---
<section>
  <p><a href="/categories/">&lt;&lt; All categories</a></p>
  <h1>category: {{ page.category }}</h1>
  <ul class="entry-list">
    {% for post in site.categories[page.category] %}
    <li>
      <span class="entry-meta">{{ post.date | date: "%-d. %B %Y" }}</span>
      <h2>
        <a href="{{ post.url | remove: '/index.html' }}">{{ post.title }}</a>
      </h2>
    </li>
    {% endfor %}
  </ul>
  <p><a href="/categories/">&lt;&lt; All categories</a></p>
</section>
