<h1 class="neon-text-cyan">search posts</h1>

<p><i>Case-insensitive substring search across post titles and URLs</i></p>

<noscript>
  <p>Post search requires JavaScript. Enable JavaScript in your browser or <a href="/categories/">browse posts by category</a></p>
</noscript>

<div id="search-controls" hidden>
  <label for="search">🔍 Search:</label> <input type="search" id="search">
  <ul id="results"></ul>
</div>

<script>
  document.getElementById('search-controls').hidden = false;

  const input = document.getElementById('search');
  const results = document.getElementById('results');

  fetch("/search.json?v={{ site.time | date: '%s' }}")
    .then(response => response.json())
    .then(posts => {
      input.addEventListener('input', () => {
        const query = input.value.trim().toLowerCase();

        results.replaceChildren();

        if (!query) return;

        const matches = posts.filter(post =>
          post.title.toLowerCase().includes(query) ||
          post.url.toLowerCase().includes(query)
        );

        if (!matches.length) {
          const li = document.createElement('li');
          li.textContent = 'None found';
          results.appendChild(li);
          return;
        }

        matches.forEach(post => {
          const li = document.createElement('li');
          const a = document.createElement('a');

          a.href = post.url;
          a.textContent = post.title;

          li.appendChild(a);
          results.appendChild(li);
        });
      });
    });
</script>
